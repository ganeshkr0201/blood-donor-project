# ============================================================
# NGINX CONFIG — Serves the React app on port 3000
# ============================================================

server {
    listen 3000;

    # Folder where React build files are stored
    root /usr/share/nginx/html;
    index index.html;

    # React Router fix:
    # Without this, refreshing any page (e.g. /search) gives 404
    # With this, nginx always serves index.html and React handles routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
