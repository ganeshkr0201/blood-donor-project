name: CD — Push to Docker Hub

# This workflow only runs when:
# 1. A push lands on main branch
# 2. Docker Hub secrets are configured in GitHub repo settings
# Jenkins handles local deployment — this pushes images to Docker Hub for cloud use

on:
  push:
    branches: [main]

jobs:
  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    # Only run if Docker Hub secrets are set — prevents failure when not configured
    if: |
      vars.DOCKER_HUB_USERNAME != '' ||
      secrets.DOCKER_HUB_USERNAME != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/blooddonor-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/blooddonor-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/blooddonor-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/blooddonor-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker Images Pushed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKER_HUB_USERNAME }}/blooddonor-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKER_HUB_USERNAME }}/blooddonor-frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
