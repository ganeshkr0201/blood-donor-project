# ============================================================
# GITHUB ACTIONS — CI Pipeline (Continuous Integration)
#
# What it does:
#   Every time code is pushed to GitHub, this runs automatically:
#   1. Builds the backend (Java/Maven)
#   2. Runs backend tests
#   3. Builds the frontend (React/Node)
#   4. Checks Docker images build correctly
#
# NOTE: Deployment (CD) is handled by Jenkins, not here.
# ============================================================

name: CI - Build and Test

# Trigger: run on every push to main or develop branch
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── JOB 1: Build and Test the Backend ──────────────────────
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compile the Java code
      - name: Compile
        working-directory: ./backend
        run: mvn clean compile -B

      # Step 4: Run unit tests (uses H2 in-memory database, no PostgreSQL needed)
      - name: Run Tests
        working-directory: ./backend
        run: mvn test -B -Dspring.profiles.active=test

      # Step 5: Package into a JAR file
      - name: Package JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

      # Step 6: Save the JAR file as a downloadable artifact
      - name: Save JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ── JOB 2: Build the Frontend ──────────────────────────────
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Install Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Step 3: Install npm packages
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      # Step 4: Build the React production bundle
      - name: Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      # Step 5: Save the build folder as a downloadable artifact
      - name: Save build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/build/

  # ── JOB 3: Verify Docker Images Build ──────────────────────
  # Runs only after both backend and frontend jobs pass
  docker-check:
    name: Docker - Verify Images Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      # Step 1: Download the code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 3: Build backend Docker image (just build, do NOT push)
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: blooddonor-backend:latest

      # Step 4: Build frontend Docker image (just build, do NOT push)
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: blooddonor-frontend:latest
