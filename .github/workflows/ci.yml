# ============================================================
# GITHUB ACTIONS — CI Pipeline (Continuous Integration)
#
# Responsibility: CODE QUALITY CHECKS ONLY
#   1. Compile the backend
#   2. Run all tests
#   3. Build the frontend
#
# What it does NOT do (that is Jenkins's job):
#   - Build Docker images
#   - Deploy the application
#   - Start any containers
# ============================================================

name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── JOB 1: Backend — Compile and Test ──────────────────────
  backend:
    name: Backend - Compile and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compile the Java source code
      - name: Compile
        working-directory: ./backend
        run: mvn clean compile -B

      # Run unit tests using H2 in-memory database (no PostgreSQL needed)
      - name: Run Tests
        working-directory: ./backend
        run: mvn test -B -Dspring.profiles.active=test

      # Save test results so they appear in GitHub Actions UI
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: backend/target/surefire-reports/

  # ── JOB 2: Frontend — Install and Build ────────────────────
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      # Build the React production bundle — confirms no build errors
      - name: Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false
