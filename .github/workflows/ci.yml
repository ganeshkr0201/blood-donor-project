name: CI — Build & Test

# GitHub Actions = CI (Continuous Integration): build + test on every push
# Jenkins = CD (Continuous Deployment): deploys locally via Docker Compose

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Backend Build & Test ──────────────────────────────────────────────
  backend-ci:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: ./backend
        run: mvn clean compile -B

      - name: Run tests (H2 in-memory DB)
        working-directory: ./backend
        run: mvn test -B -Dspring.profiles.active=test

      - name: Package JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ── Job 2: Frontend Build ────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache here — avoids stale lock file issues
          
      - name: Install dependencies
        working-directory: ./frontend
        # Use npm install instead of npm ci to handle lock file mismatches
        run: npm install

      - name: Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8080
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ── Job 3: Docker Build Verification (build only, no push) ───────────────────
  docker-build-check:
    name: Docker — Verify Images Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: blooddonor-backend:ci-check

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: blooddonor-frontend:ci-check

      - name: CI Summary
        run: |
          echo "## CI Pipeline Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend compile | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend JAR package | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker images build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **CD (Deploy)** is handled by Jenkins locally via Docker Compose" >> $GITHUB_STEP_SUMMARY
