name: CI — Build & Test

# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions  →  CI only  (build + test on every push / pull request)
# Jenkins         →  CD only  (deploy via docker-compose, runs locally)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── 1. Backend: Compile → Test → Package ────────────────────────────────────
  backend-ci:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: ./backend
        run: mvn clean compile -B

      - name: Test (H2 in-memory DB)
        working-directory: ./backend
        run: mvn test -B -Dspring.profiles.active=test

      - name: Package JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ── 2. Frontend: Install → Build ────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8080
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ── 3. Docker: Verify images build (no push — CD is Jenkins) ────────────────
  docker-build-check:
    name: Docker — Verify Images Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: blooddonor-backend:ci

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: blooddonor-frontend:ci

      - name: Summary
        run: |
          echo "## ✅ CI Passed" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend compile + test + package | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend install + build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker images build check | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🚀 **Deployment (CD) is handled by Jenkins** running locally via Docker Compose" >> $GITHUB_STEP_SUMMARY
