# ==============================================================================
# GITHUB ACTIONS — CD Pipeline (Continuous Deployment)
#
# Responsibility: SSH INTO AWS EC2 AND EXECUTE DEPLOYMENT
#   1. Triggers on a successful commit/push to the main branch
#   2. Securely authenticates via SSH private key
#   3. Triggers the deploy.sh script on the remote EC2 instance
# ==============================================================================

name: CD - Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production (EC2)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      # ── SSH DEPLOYMENT STEP ──────────────────────────────────────────────────
      # Uses a standard, trusted SSH action to log into your EC2 server securely
      # and execute the update/restart commands.
      - name: Execute Remote Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Successfully authenticated via SSH to AWS EC2!"
            
            # Ensure the deployment directory exists
            if [ ! -d "$HOME/blood-donor-system" ]; then
              echo "Project directory not found on server. Initializing..."
              git clone https://github.com/${{ github.repository }}.git $HOME/blood-donor-system
            fi
            
            # Change directory to target project
            cd $HOME/blood-donor-system
            
            # Ensure deploy.sh has execution permissions
            chmod +x scripts/deploy.sh
            
            # Execute deployment
            ./scripts/deploy.sh
