# ============================================================
# DOCKER COMPOSE — Runs all 4 services together
#
# Services:
#   1. postgres  — Database          → port 5433
#   2. backend   — Spring Boot API   → port 8080
#   3. frontend  — React + nginx     → port 3000
#   4. jenkins   — CI/CD server      → port 8090
#
# Run everything with: docker-compose up --build
# ============================================================

services:

  # ── 1. PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: blooddonor-postgres
    environment:
      POSTGRES_DB: blooddonordb
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      # Save database data even if container is stopped/restarted
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blooddonor-network
    # Health check: wait until postgres is ready before starting backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blooddonordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Spring Boot Backend ──────────────────────────────────
  backend:
    build: ./backend
    container_name: blooddonor-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/blooddonordb
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-blooddonorsystemsecretkey2024verylongsecretkey}
      JWT_EXPIRATION: 86400000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    # Backend starts only AFTER postgres is healthy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blooddonor-network
    restart: unless-stopped

  # ── 3. React Frontend ───────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: blooddonor-frontend
    ports:
      - "3000:3000"
    # Frontend starts after backend is up
    depends_on:
      - backend
    networks:
      - blooddonor-network
    restart: unless-stopped

  # ── 4. Jenkins CI/CD Server ─────────────────────────────────
  jenkins:
    build: ./jenkins
    container_name: blooddonor-jenkins
    ports:
      - "8090:8080"    # Jenkins UI at http://localhost:8090
      - "50000:50000"  # Jenkins agent communication port
    volumes:
      # Keep Jenkins data (jobs, builds) when container restarts
      - jenkins_data:/var/jenkins_home
      # Allow Jenkins to run Docker commands on the host machine
      - /var/run/docker.sock:/var/run/docker.sock
      # Give Jenkins access to the project source code
      - .:/workspace
    networks:
      - blooddonor-network
    restart: unless-stopped

# ── Volumes (persistent storage) ────────────────────────────
volumes:
  postgres_data:   # Stores database tables and data
  jenkins_data:    # Stores Jenkins jobs, builds, plugins

# ── Network (containers talk to each other by name) ─────────
networks:
  blooddonor-network:
    driver: bridge
