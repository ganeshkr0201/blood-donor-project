
services:

  postgres:
    image: postgres:16-alpine
    container_name: blooddonor-postgres
    environment:
      POSTGRES_DB: blooddonordb
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blooddonor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blooddonordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blooddonor-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/blooddonordb
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-blooddonorsystemsecretkey2024verylongsecretkey}
      JWT_EXPIRATION: 86400000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blooddonor-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: blooddonor-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - blooddonor-network
    restart: unless-stopped

  jenkins:
    profiles: ["jenkins"]
    build: ./jenkins
    container_name: blooddonor-jenkins
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    networks:
      - blooddonor-network
    restart: unless-stopped

volumes:
  postgres_data:
  jenkins_data:

networks:
  blooddonor-network:
    driver: bridge
